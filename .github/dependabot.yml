# Weekly updates, tested by CI like any other push. Minor and patch updates arrive as one grouped pull
# request; a major one arrives on its own, because it can need code changes.
version: 2
updates:
    - package-ecosystem: npm
      directory: /
      target-branch: dev
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      # uuid 12 and later are ES module only, and Vercel's runtime cannot require them: 14 crashed
      # the server on start (2026-10-29), though every test passed on a laptop.
      ignore:
          - dependency-name: uuid
            update-types: ['version-update:semver-major']
      groups:
          npm:
              patterns: ['*']
              update-types: [minor, patch]
    - package-ecosystem: github-actions
      directory: /
      target-branch: dev
      schedule:
          interval: weekly
      groups:
          actions:
              patterns: ['*']
