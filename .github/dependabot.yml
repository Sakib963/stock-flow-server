# Weekly updates as one grouped pull request per ecosystem, tested by CI like any other push.
version: 2
updates:
    - package-ecosystem: npm
      directory: /
      target-branch: dev
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      groups:
          npm:
              patterns: ['*']
    - package-ecosystem: github-actions
      directory: /
      target-branch: dev
      schedule:
          interval: weekly
      groups:
          actions:
              patterns: ['*']
