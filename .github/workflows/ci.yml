name: CI

on:
    push:
        branches: [dev, 'feat/**', 'fix/**']
    pull_request:
        branches: [dev]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/dev' }}

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            TZ: UTC
        steps:
            - uses: actions/checkout@v7
              with:
                  path: stock-flow-server

            # The suite builds its database from ../stock-flow-documents/generated_schema.sql.
            - uses: actions/checkout@v7
              with:
                  repository: Sakib963/stock-flow-documents
                  ref: main
                  token: ${{ secrets.DOCUMENTS_READ_TOKEN }}
                  path: stock-flow-documents

            - run: docker compose up -d --wait
              working-directory: stock-flow-server

            - uses: actions/setup-node@v7
              with:
                  node-version-file: stock-flow-server/.nvmrc
                  cache: npm
                  cache-dependency-path: stock-flow-server/package-lock.json

            - run: npm ci
              working-directory: stock-flow-server

            - run: npm test
              working-directory: stock-flow-server

            - run: npm audit --omit=dev --audit-level=high
              working-directory: stock-flow-server

    # Only a push to dev that passed the tests deploys. Vercel's own Git deploys are off in
    # vercel.json, so this is the one way the server goes live. Its settings stay in Vercel.
    deploy:
        needs: test
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        concurrency:
            group: deploy-vercel
            cancel-in-progress: false
        env:
            VERCEL_ORG_ID: team_cug7jOCNgj5YL7PCFu21b3uP
            VERCEL_PROJECT_ID: prj_mbOm6NWMwEuvJIq5fz0TjmAMc8n9
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc

            - run: npm install --global vercel@50.1.3

            - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

            - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

            - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

            - name: The server answers
              run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors https://stock-flow-server.vercel.app/
